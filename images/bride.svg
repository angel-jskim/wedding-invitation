<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="임시 신부 캐릭터 찹쌀이">
  <defs>
    <radialGradient id="body" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3e6dc"/>
    </radialGradient>
    <linearGradient id="veil" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".35"/>
    </linearGradient>
  </defs>
  <!-- veil back -->
  <path d="M90 70 C40 120 30 230 55 300 L245 300 C270 230 260 120 210 70 Z" fill="url(#veil)" stroke="#ead9cc" stroke-width="2"/>
  <!-- body (mochi) -->
  <ellipse cx="150" cy="215" rx="105" ry="92" fill="url(#body)" stroke="#e2cfc2" stroke-width="3"/>
  <!-- tiara -->
  <path d="M112 128 L122 104 L136 122 L150 96 L164 122 L178 104 L188 128 Z" fill="#f6d77a" stroke="#d9b24d" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="150" cy="112" r="5" fill="#f4a3b4"/>
  <!-- eyes -->
  <ellipse cx="118" cy="205" rx="8" ry="10" fill="#3b2a26"/>
  <ellipse cx="182" cy="205" rx="8" ry="10" fill="#3b2a26"/>
  <circle cx="121" cy="201" r="3" fill="#fff"/>
  <circle cx="185" cy="201" r="3" fill="#fff"/>
  <!-- cheeks -->
  <ellipse cx="96" cy="228" rx="16" ry="9" fill="#f7b6c2" opacity=".75"/>
  <ellipse cx="204" cy="228" rx="16" ry="9" fill="#f7b6c2" opacity=".75"/>
  <!-- mouth -->
  <path d="M140 226 Q150 236 160 226" fill="none" stroke="#3b2a26" stroke-width="3" stroke-linecap="round"/>
  <!-- bouquet -->
  <path d="M138 262 L150 300 L162 262 Z" fill="#9cc79a" stroke="#6f9e6d" stroke-width="2"/>
  <circle cx="138" cy="258" r="11" fill="#f4a3b4"/>
  <circle cx="162" cy="258" r="11" fill="#f9c784"/>
  <circle cx="150" cy="248" r="12" fill="#f28fa5"/>
  <!-- question mark -->
  <text x="236" y="120" font-family="sans-serif" font-size="46" font-weight="700" fill="#e98da0" transform="rotate(14 236 120)">?</text>
  <text x="44" y="96" font-family="sans-serif" font-size="30" font-weight="700" fill="#f1b9c5" transform="rotate(-12 44 96)">?</text>
</svg>
